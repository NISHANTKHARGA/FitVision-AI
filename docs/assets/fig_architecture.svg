<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" font-family="Georgia, 'Times New Roman', serif">
  <rect width="1180" height="640" fill="#FAF8F4"/>

  <!-- Title -->
  <text x="40" y="42" font-size="22" font-weight="bold" fill="#171512">FitVision AI — Inference Pipeline</text>
  <text x="40" y="64" font-size="12" fill="#6E675C">Local, single RTX 4060 Laptop GPU · Apache-2.0 model · no cloud calls</text>

  <!-- Column 1: Inputs -->
  <rect x="40" y="90" width="210" height="120" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5"/>
  <text x="60" y="122" font-size="15" font-weight="bold" fill="#171512">Your photo</text>
  <text x="60" y="145" font-size="11" fill="#6E675C">person.jpg · RGB</text>
  <text x="60" y="165" font-size="11" fill="#6E675C">front-facing · good light</text>
  <text x="60" y="190" font-size="10" fill="#B4432F">MediaPipe pose + quality scan</text>

  <rect x="40" y="240" width="210" height="120" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5"/>
  <text x="60" y="272" font-size="15" font-weight="bold" fill="#171512">Garment photo</text>
  <text x="60" y="295" font-size="11" fill="#6E675C">product / worn shot</text>
  <text x="60" y="315" font-size="11" fill="#6E675C">plain background preferred</text>
  <text x="60" y="340" font-size="10" fill="#B4432F">rembg (u²-Net) cutout · k-means colours</text>

  <!-- arrows -->
  <line x1="250" y1="150" x2="290" y2="225" stroke="#B4432F" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="250" y1="300" x2="290" y2="255" stroke="#B4432F" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Column 2: try-on model -->
  <rect x="300" y="120" width="270" height="280" rx="14" fill="#171512"/>
  <text x="320" y="156" font-size="16" font-weight="bold" fill="#FAF8F4">FASHN VTON v1.5</text>
  <text x="320" y="176" font-size="10.5" fill="#C9C4B8">972M-param MMDiT · pixel space</text>
  <text x="320" y="192" font-size="10.5" fill="#C9C4B8">8 double-stream + 16 single-stream blocks</text>
  <text x="320" y="208" font-size="10.5" fill="#C9C4B8">12×12 patch embed · 576×864 output</text>
  <text x="320" y="224" font-size="10.5" fill="#C9C4B8">Rectified flow · CFG g=1.5 · bf16</text>
  <text x="320" y="248" font-size="10.5" fill="#E8C9BC">DWPose keypoints + FASHN human parser</text>
  <text x="320" y="264" font-size="10.5" fill="#E8C9BC">clothing-agnostic masking of the person</text>
  <text x="320" y="284" font-size="10.5" fill="#C9C4B8">Maskless (default) or Masked inference</text>
  <text x="320" y="300" font-size="10.5" fill="#C9C4B8">4–20 sampling steps · seeded</text>

  <!-- arrow to post-processing -->
  <line x1="570" y1="260" x2="610" y2="260" stroke="#B4432F" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Column 3: output + analysis -->
  <rect x="620" y="90" width="240" height="120" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5"/>
  <text x="640" y="122" font-size="15" font-weight="bold" fill="#171512">Generated try-on</text>
  <text x="640" y="145" font-size="11" fill="#6E675C">576×864 · PNG · seed reproducible</text>
  <text x="640" y="163" font-size="11" fill="#6E675C">3 fit variants (Slim / Regular / Oversized)</text>
  <text x="640" y="182" font-size="11" fill="#6E675C">torsional non-rigid warp, see docs/FIT_WARP.md</text>

  <rect x="620" y="240" width="240" height="190" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5"/>
  <text x="640" y="272" font-size="14" font-weight="bold" fill="#171512">Honest CV analysis</text>
  <text x="640" y="295" font-size="10.5" fill="#6E675C">Colour: Lab chroma histogram · CIE76 ΔE</text>
  <text x="640" y="313" font-size="10.5" fill="#6E675C">Pattern: Canny density + ORB / RANSAC</text>
  <text x="640" y="331" font-size="10.5" fill="#6E675C">Appearance: CLIP ViT-B/32 cosine</text>
  <text x="640" y="349" font-size="10.5" fill="#6E675C">Logos/text: EasyOCR token recall</text>
  <text x="640" y="367" font-size="10.5" fill="#6E675C">Identity: face-detection-aligned SSIM</text>
  <text x="640" y="385" font-size="10.5" fill="#6E675C">Alignment: pose-landmark drift (MediaPipe)</text>
  <text x="640" y="410" font-size="10" fill="#B4432F">No fabricated confidence scores</text>

  <!-- arrow to report -->
  <line x1="860" y1="150" x2="900" y2="200" stroke="#B4432F" stroke-width="2.5" marker-end="url(#arr)"/>
  <line x1="860" y1="345" x2="900" y2="280" stroke="#B4432F" stroke-width="2.5" marker-end="url(#arr)"/>

  <!-- Column 4: outputs -->
  <rect x="910" y="120" width="230" height="120" rx="12" fill="#F3E3DC" stroke="#B4432F" stroke-width="1.5"/>
  <text x="930" y="152" font-size="15" font-weight="bold" fill="#94351F">Try-on result</text>
  <text x="930" y="175" font-size="11" fill="#7C3A26">before / after slider</text>
  <text x="930" y="193" font-size="11" fill="#7C3A26">3-fit comparison grid</text>
  <text x="930" y="212" font-size="11" fill="#7C3A26">download · save to history</text>

  <rect x="910" y="270" width="230" height="160" rx="12" fill="#FFFFFF" stroke="#E7E2D8" stroke-width="1.5"/>
  <text x="930" y="302" font-size="15" font-weight="bold" fill="#171512">Reliability report</text>
  <text x="930" y="325" font-size="10.5" fill="#6E675C">measured vs qualitative</text>
  <text x="930" y="343" font-size="10.5" fill="#6E675C">preservation checklist</text>
  <text x="930" y="361" font-size="10.5" fill="#6E675C">fit verdicts from YOUR measurements</text>
  <text x="930" y="379" font-size="10.5" fill="#6E675C">transparent sizing rules (shown in UI)</text>
  <text x="930" y="397" font-size="10.5" fill="#6E675C">outfit palette recommendations</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#B4432F"/>
    </marker>
  </defs>
</svg>
